# MangoWC Configuration
# Based on dwl but with a config file.

# Modifiers: SUPER, ALT, CTRL, SHIFT
# Syntax: bind=<MODIFIERS>,<KEY>,<ACTION>,<PARAMETERS>

# Monitor Configuration
# monitor=[name],[res],[pos],[scale]
monitor=DP-1,2560x1440@119.998,0x0,1
monitor=DP-2,1920x1080@60.0,2560x0,1

# Basic Binds
bind=SUPER,Return,spawn,foot
bind=SUPER,Space,spawn,fuzzel
bind=SUPER,q,killclient,
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,e,quit,

# Layouts
bind=SUPER,t,setlayout,tiled
bind=SUPER,f,setlayout,fullscreen
bind=SUPER,m,setlayout,monocle
bind=SUPER,s,togglefloating,

# Navigation (Vim-like)
bind=SUPER,j,focusstack,1
bind=SUPER,k,focusstack,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,0.05

# Window resizing/moving (Floating mode)
bind=SUPER,Left,move,x=-20
bind=SUPER,Right,move,x=20
bind=SUPER,Up,move,y=-20
bind=SUPER,Down,move,y=20

# Workspaces (Tags in dwl-speak)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Aesthetics (MangoWC specifics)
# These might vary depending on the version, but these are common:
gap_size=10
border_size=2
active_border_color=0x7f5bccaa
inactive_border_color=0x505050ff

# Autostart (MangoWC uses a simple spawn list or a script)
# Using spawn for common background services
spawn=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
spawn=blueman-applet
spawn=vesktop
