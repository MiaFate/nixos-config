# MangoWC Configuration
# Documentation: https://mangowm.github.io/docs/configuration/basics

# Modifiers: SUPER, ALT, CTRL, SHIFT

# Monitor Configuration
# monitorrule=name:REGEX,width:W,height:H,refresh:R,x:X,y:Y,scale:S
monitorrule=name:^DP-1$,width:2560,height:1440,refresh:119.998,x:0,y:0,scale:1
monitorrule=name:^DP-2$,width:1920,height:1080,refresh:60,x:2560,y:0,scale:1

# Environment Variables
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=WLR_DRM_NO_DIRECT_SCANOUT,1

# Keyboard Settings
xkb_rules_layout=us
xkb_rules_variant=intl
repeat_rate=40
repeat_delay=300
numlockon=1

# Mouse Settings
accel_profile=flat
accel_speed=-0.1
mouse_natural_scrolling=0

# Trackpad Settings
tap_to_click=1
trackpad_natural_scrolling=1
# trackpad_accel_profile=2

# Basic Binds
# bind=<MODIFIERS>,<KEY>,<ACTION>,<PARAMETERS>
keymode=common
bind=SUPER,Return,spawn,foot
bind=SUPER,Space,spawn,fuzzel
bind=SUPER,q,killclient,
bind=SUPER,R,reload_config
bind=SUPER+SHIFT,e,quit,
bind=SUPER,O,toggleoverview

# Monitor Focus/Movement
bind=SUPER,comma,focusmon,-1
bind=SUPER,period,focusmon,1
bind=SUPER+SHIFT,comma,tagmon,-1
bind=SUPER+SHIFT,period,tagmon,1

# Mouse Bindings (Niri-like)
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Layouts
bind=SUPER,t,setlayout,tiled
#bind=SUPER,f,setlayout,fullscreen
bind=SUPER,m,setlayout,monocle
bind=SUPER,s,togglefloating,

keymode=default
bind=SUPER,F,togglefullscreen

# Navigation (Vim-like)
bind=SUPER,j,focusstack,1
bind=SUPER,k,focusstack,-1
bind=SUPER,h,setmfact,-0.05
bind=SUPER,l,setmfact,0.05

# Window resizing/moving (Floating mode)
bind=SUPER,Left,smartmovewin,x=-20
bind=SUPER,Right,smartmovewin,x=20
bind=SUPER,Up,smartmovewin,y=-20
bind=SUPER,Down,smartmovewin,y=20

# Workspaces (Tags in dwl-speak)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Screenshots (Using lowercase 's' which is more standard for SHIFT binds)
bind=SUPER+SHIFT,s,spawn,/home/mia/.local/bin/screenshot area
bind=SUPER,Print,spawn,/home/mia/.local/bin/screenshot

# Aesthetics
border_radius=12
borderpx=3
gappih=6
gappiv=6
gappoh=6
gappov=6
# Background color of the root window
rootcolor=0x323232ff
# Active window border
focuscolor=0x7f5bccaa
# Inactive window border
bordercolor=0x505050ff
# Drop shadow when dragging windows
#dropcolor=0x8FBA7C55
# Urgent window border (alerts)
urgentcolor=0xad401fff

#animations
animations=1
#layer_animations=1

animation_type_open=zoom
animation_type_close=slide
#layer_animation_type_open=slide
#layer_animation_type_close=slide

animation_fade_in=3
animation_fade_out=3

animation_duration_move=300
animation_duration_open=250
animation_duration_tag=200
animation_duration_close=200
animation_duration_focus=0

# Autostart
exec-once=/home/mia/programacion/rustbar/result/bin/rustbar
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=blueman-applet
exec-once=vesktop
exec-once=awww-daemon
exec-once=awww img /home/mia/Pictures/Wallpapers/Anime-Girl-Night-Sky.jpg
